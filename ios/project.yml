# XcodeGen specification for the iPhone app. The Xcode project is generated from this file
# (`xcodegen generate` in this folder) and is not committed.
name: LiveCueRemake

options:
  # The version CI generates the project with. Older versions are untested.
  minimumXcodeGenVersion: "2.46.0"
  bundleIdPrefix: com.mahmudkarim
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.3"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

    # Swift 5 language mode with complete concurrency checking: data-race findings arrive as warnings,
    # so they do not cost a CI cycle. The core package is in Swift 6 mode through its own manifest.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete

    # The project is unsigned by default, which is what the device build for LiveContainer needs.
    # Simulator test runs switch ad hoc signing on from the command line (see .github/workflows/ios.yml):
    # an unsigned simulator build has no entitlements, and its Keychain calls fail with -34018.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

packages:
  LiveCueCore:
    path: LiveCueCore
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.15.6
  DesertAnt:
    url: https://github.com/Desert-Ant-Labs/desert-ant-core
    exactVersion: 3.1.0

targets:
  LiveCueRemake:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: LiveCueCore
        product: LiveCueCore
      - package: FluidAudio
        product: FluidAudio
      - package: DesertAnt
        product: Voz
    info:
      # Written by XcodeGen on every generation; not committed.
      path: Generated/LiveCueRemake-Info.plist
      properties:
        CFBundleDisplayName: LiveCue Remake
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "LiveCue transcribes audio on this iPhone, sends it to your PC for local speech models, or streams it directly to Meta for cloud transcription, depending on your selected provider."
        NSCameraUsageDescription: "LiveCue scans the pairing QR code displayed on your Windows PC."
        NSLocalNetworkUsageDescription: "LiveCue connects privately to your Windows PC."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mahmudkarim.LiveCueRemake
        TARGETED_DEVICE_FAMILY: "1"
        # Simulator builds only, and only used when a test run switches signing on. Xcode then embeds
        # this file as simulated entitlements in place of its default, an application identifier of
        # FAKETEAMID.<bundle id>. CI showed that the Keychain works with either. Device builds stay
        # unsigned and carry no entitlements.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Support/Simulator.entitlements
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"

  # Hosted unit tests: the app is their host, so the state owners and view models are tested in place.
  LiveCueRemakeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: LiveCueRemake
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mahmudkarim.LiveCueRemake.Tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"

  LiveCueRemakeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: LiveCueRemake
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mahmudkarim.LiveCueRemake.UITests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: LiveCueRemake

schemes:
  LiveCueRemake:
    build:
      targets:
        LiveCueRemake: all
        LiveCueRemakeTests: [test]
        LiveCueRemakeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # Coverage for our own code only, not for the speech packages.
      gatherCoverageData: true
      coverageTargets:
        - LiveCueRemake
        - package: LiveCueCore/LiveCueCore
      targets:
        - package: LiveCueCore/LiveCueCoreTests
        - name: LiveCueRemakeTests
        - name: LiveCueRemakeUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
