name: iOS

# Builds and tests the iPhone app on free GitHub-hosted runners. No secrets are used and no signing
# identity is needed: simulator builds are signed ad hoc and the device build is unsigned. No speech
# model is downloaded or run.
#
# Two sizes of run, chosen by the Plan job:
#
#   quick  A push to a work-package branch (wp/**). The Linux core job, the helper-script tests and
#          one macOS job that builds the app and runs the two unit-test bundles on the iOS 26
#          simulator. A public repository gets only a few macOS jobs at a time, and many builders
#          push at once, so a feature branch takes one.
#   full   A push to main, a pull request into main, and a manual run (unless it asks for quick).
#          Both simulator legs with all three bundles and exported screenshots, and the unsigned
#          device build with IPA validation.
#
# A full run on any branch:  gh workflow run ios.yml --ref <branch> -f scope=full

on:
  push:
    branches:
      - main
      - "wp/**"
    paths:
      - "ios/**"
      - "scripts/ci/**"
      - ".github/workflows/ios.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ios/**"
      - "scripts/ci/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      scope:
        description: "full: both simulator legs with UI tests, and the device build. quick: what a push to wp/** runs."
        type: choice
        options:
          - full
          - quick
        default: full

permissions:
  contents: read

# A newer run for the same branch and trigger replaces the one in progress.
concurrency:
  group: ios-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Every macOS job uses this Xcode and fails at once if the runner image does not have it.
  # It ships the iOS 26.2 SDK, which the Liquid Glass wrapper needs, and it is installed on both
  # the macos-26 and the macos-15 image.
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  PROJECT: ios/LiveCueRemake.xcodeproj
  SCHEME: LiveCueRemake
  APP_NAME: LiveCueRemake
  # What the built app must report. Change these together with ios/project.yml.
  BUNDLE_ID: com.mahmudkarim.LiveCueRemake
  APP_VERSION: "1.1.0"
  APP_BUILD: "2"
  MINIMUM_IOS: "18.0"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      legs: ${{ steps.plan.outputs.legs }}
    steps:
      - name: Choose a quick or a full run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REQUESTED: ${{ inputs.scope }}
        run: |
          scope=quick
          if [[ "$EVENT" == "pull_request" || "$REF" == "refs/heads/main" ]]; then
            scope=full
          fi
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            scope="${REQUESTED:-full}"
          fi

          # Native Liquid Glass on macos-26. The material fallback on macos-15: only that image
          # has iOS 18 simulator runtimes.
          glass='"leg":"glass","runner":"macos-26","runtime":"26.2"'
          fallback='"leg":"fallback","runner":"macos-15","runtime":"18.6"'
          if [[ "$scope" == "full" ]]; then
            legs="[{$glass,\"title\":\"iOS tests\",\"ui\":true},{$fallback,\"title\":\"iOS tests\",\"ui\":true}]"
          else
            scope=quick
            legs="[{$glass,\"title\":\"iOS unit tests\",\"ui\":false}]"
          fi

          echo "Event $EVENT on $REF: a $scope run."
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "legs=$legs" >> "$GITHUB_OUTPUT"

  ci-scripts:
    name: CI scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Test the helper scripts
        run: python3 -B -m unittest discover -s scripts/ci/tests -t scripts/ci/tests

      - name: Check shell syntax
        run: |
          for script in scripts/ci/*.sh; do
            bash -n "$script"
          done

  core-linux:
    name: Core (Linux)
    runs-on: ubuntu-latest
    # The same compiler line as the pinned Xcode (Swift 6.2).
    container: swift:6.2-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Show the toolchain
        run: swift --version

      # Glass symbols stay in the one wrapper file; the core imports only Foundation.
      - name: Lint the Swift sources
        run: bash scripts/ci/lint_swift.sh

      - name: Build
        run: swift build --package-path ios/LiveCueCore

      - name: Test
        run: swift test --package-path ios/LiveCueCore

  ios-tests:
    name: ${{ matrix.title }} (${{ matrix.leg }}, iOS ${{ matrix.runtime }})
    needs: [plan, ci-scripts, core-linux]
    runs-on: ${{ matrix.runner }}
    # A full leg also runs the UI tests, whose runner can take several minutes to start.
    timeout-minutes: ${{ matrix.ui && 60 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - uses: actions/checkout@v7

      - name: Require the pinned Xcode
        run: bash scripts/ci/require_xcode.sh

      - name: Generate the Xcode project and resolve packages
        timeout-minutes: 10
        run: bash scripts/ci/generate_project.sh "$RUNNER_TEMP/DerivedData"

      # What the pinned Xcode resolved, kept with the evidence: this is the file that is committed as
      # ios/Package.resolved.
      - name: Keep the package resolution
        continue-on-error: true
        run: |
          mkdir -p artifacts
          cp "$PROJECT/project.xcworkspace/xcshareddata/swiftpm/Package.resolved" artifacts/Package.resolved

      - name: Select a simulator
        id: simulator
        run: python3 scripts/ci/select_simulator.py --runtime "${{ matrix.runtime }}"

      - name: Boot the simulator
        timeout-minutes: 10
        run: python3 scripts/ci/boot_simulator.py "${{ steps.simulator.outputs.udid }}"

      # Signing is off in the project, and a simulator build made that way has no entitlements:
      # Keychain calls then fail with -34018. The three signing arguments switch ad hoc signing on
      # for the test run, which is what makes the Keychain work.
      #
      # A quick run skips the UI test bundle; the core tests and the hosted unit tests still run.
      - name: Run the tests
        timeout-minutes: ${{ matrix.ui && 40 || 25 }}
        env:
          SKIPPED: ${{ matrix.ui && ' ' || '-skip-testing:LiveCueRemakeUITests' }}
        run: |
          # $SKIPPED is left unquoted on purpose: it is one argument or nothing.
          bash scripts/ci/xcodebuild_logged.sh "artifacts/xcodebuild-${{ matrix.leg }}.log" test \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,arch=arm64,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "artifacts/Tests-${{ matrix.leg }}.xcresult" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 600 \
            $SKIPPED \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY=-

      - name: Show the app's signature and entitlements after a failure
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/$APP_NAME.app"
          codesign --display --verbose=2 --entitlements - "$app" || true
          for binary in "$app/$APP_NAME" "$app/$APP_NAME.debug.dylib"; do
            if [[ -f "$binary" ]]; then
              echo "Simulated entitlements in $(basename "$binary"):"
              xcrun otool -s __TEXT __entitlements -V "$binary" | tail -n 30 || true
            fi
          done

      # xcodebuild also succeeds when a scheme stops running one of its bundles; this check does not.
      - name: Check that every expected test bundle ran
        if: ${{ !cancelled() }}
        env:
          UI_BUNDLE: ${{ matrix.ui && '--require-bundle LiveCueRemakeUITests' || ' ' }}
        run: |
          # $UI_BUNDLE is left unquoted on purpose: it is two arguments or nothing.
          python3 scripts/ci/check_test_results.py "artifacts/Tests-${{ matrix.leg }}.xcresult" \
            --require-bundle LiveCueCoreTests --require-bundle LiveCueRemakeTests $UI_BUNDLE \
            --save "artifacts/test-results-${{ matrix.leg }}.json"

      - name: Save a final screenshot
        if: ${{ !cancelled() && matrix.ui && steps.simulator.outputs.udid != '' }}
        continue-on-error: true
        timeout-minutes: 2
        run: |
          mkdir -p artifacts
          xcrun simctl io "${{ steps.simulator.outputs.udid }}" screenshot "artifacts/final-screen-${{ matrix.leg }}.png"

      - name: Export screenshots from the result bundle
        if: ${{ !cancelled() && matrix.ui }}
        run: |
          python3 scripts/ci/export_screenshots.py "artifacts/Tests-${{ matrix.leg }}.xcresult" \
            "artifacts/screenshots-${{ matrix.leg }}" \
            --prefix "${{ matrix.leg }}-ios${{ steps.simulator.outputs.runtime }}"

      - name: Upload the result bundle, log and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-evidence-${{ matrix.leg }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  device-build:
    name: Device build (unsigned IPA)
    needs: [plan, ci-scripts, core-linux]
    if: ${{ needs.plan.outputs.scope == 'full' }}
    runs-on: macos-26
    timeout-minutes: 40
    env:
      IPA_NAME: LiveCueRemake.ipa
    steps:
      - uses: actions/checkout@v7

      - name: Require the pinned Xcode
        run: bash scripts/ci/require_xcode.sh

      - name: Generate the Xcode project and resolve packages
        timeout-minutes: 10
        run: bash scripts/ci/generate_project.sh "$RUNNER_TEMP/DerivedData"

      # The scheme gathers coverage for tests, and xcodebuild then instruments plain builds of the
      # scheme as well, packages included. The two coverage settings keep that out of the shipped
      # app (xcodebuild refuses -enableCodeCoverage outside test actions); validate_ipa.py fails
      # the job if the instrumentation comes back.
      - name: Build the Release app for devices, unsigned
        timeout-minutes: 30
        run: |
          bash scripts/ci/xcodebuild_logged.sh artifacts/xcodebuild-device.log build \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CLANG_ENABLE_CODE_COVERAGE=NO CLANG_COVERAGE_MAPPING=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package the IPA
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/$APP_NAME.app"
          if [[ ! -d "$app" ]]; then
            echo "::error title=App not built::$app does not exist."
            exit 1
          fi
          echo "Contents of $APP_NAME.app:"
          ls -la "$app"
          xcrun lipo -info "$app/$APP_NAME"
          # For the record: an unsigned device build has no signature and so no entitlements.
          codesign --display --verbose=2 --entitlements - "$app" 2>&1 || true

          mkdir -p "$RUNNER_TEMP/Package/Payload"
          ditto "$app" "$RUNNER_TEMP/Package/Payload/$APP_NAME.app"
          # -y keeps symbolic links, -X leaves out extended attributes: nothing but Payload/ goes in.
          (cd "$RUNNER_TEMP/Package" && zip -q -r -y -X "$GITHUB_WORKSPACE/artifacts/$IPA_NAME" Payload)
          ls -la artifacts

      - name: Validate the IPA
        run: |
          python3 scripts/ci/validate_ipa.py "artifacts/$IPA_NAME" \
            --bundle-id "$BUNDLE_ID" --version "$APP_VERSION" --build "$APP_BUILD" \
            --minimum-os "$MINIMUM_IOS" --device-family 1
          cd artifacts
          shasum -a 256 "$IPA_NAME" | tee "$IPA_NAME.sha256"

      - name: Upload the IPA, checksum and build log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: livecue-remake-ipa
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
